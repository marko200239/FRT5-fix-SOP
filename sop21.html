<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SOP 21 - 水柱水霧電路檢測</title>
    <style>
        body { font-family: "Microsoft JhengHei"; background: #0f0f0f; color: white; padding: 30px; line-height: 1.8; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border-top: 6px solid #d32f2f; }
        h1 { color: #d32f2f; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .step { background: #252525; margin-bottom: 15px; padding: 15px; border-radius: 8px; border-left: 4px solid #9b59b6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOP 21：水柱水霧無法切換（電路篇）</h1>
        <div class="step">1. 檢查遙控器舵量。若無作動，檢查內部排線是否脫落或更換遙控器。</div>
        <div class="step">2. 觀察砲塔控制盒繼電器有無作動。無作動則更換控制盒。</div>
        <div class="step">3. <b>馬達測試：</b>將馬達端 黃/白/黑線 接至車體黑線，紅線不動。若開機不動作則馬達損壞。</div>
        <button onclick="history.back()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">返回</button>
    </div>
</body>
</html>
