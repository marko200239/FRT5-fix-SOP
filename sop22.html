<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SOP 22 - 水柱水霧馬達判斷</title>
    <style>
        body { font-family: "Microsoft JhengHei"; background: #0f0f0f; color: white; padding: 30px; line-height: 1.8; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border-top: 6px solid #d32f2f; }
        h1 { color: #d32f2f; border-bottom: 2px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOP 22：簡易水柱水霧馬達判斷[cite: 3]</h1>
        <p>當繼電器正常作動但功能失效時，執行以下測試：</p>
        <div style="background: #222; padding: 20px; border-radius: 8px; border: 1px dashed #d32f2f;">
            1. 找到馬達端線組：黃線、白線、黑線[cite: 3]。<br>
            2. 將此三條線連接至車體端黑線[cite: 3]。<br>
            3. 紅線維持不動[cite: 3]。<br>
            4. 重新開機觀察是否作動[cite: 3]。
        </div>
        <p style="color: #e74c3c; font-weight: bold;">若執行上述步驟後仍無作動，判定馬達損壞，需更換處理[cite: 3]。</p>
        <button onclick="history.back()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">返回</button>
    </div>
</body>
</html>
