<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SOP 20 - 近接開關判斷</title>
    <style>
        body { font-family: "Microsoft JhengHei"; background: #0f0f0f; color: white; padding: 30px; line-height: 1.8; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border-top: 6px solid #d32f2f; }
        h1 { color: #d32f2f; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .meter { background: #000; color: #0f0; padding: 15px; border-radius: 8px; border: 2px solid #333; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOP 20：近接開關判斷（帶電量測）[cite: 3]</h1>
        <p>量測條件：感測器需接上 24V 電源[cite: 3]。</p>
        <div class="meter">
            步驟：<br>
            1. 電表切換至 DC 直流電壓檔 (>24V)[cite: 3]。<br>
            2. 黑表筆量測藍線 (GND)[cite: 3]。<br>
            3. 紅表筆量測黑線 (Signal)[cite: 3]。
        </div>
        <p>結果判斷：<br>
        - 無物體靠近時：應顯示 0V 左右[cite: 3]。<br>
        - 金屬靠近時：LED 燈亮起，應顯示 <b>24V</b> 左右[cite: 3]。</p>
        <button onclick="history.back()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">返回</button>
    </div>
</body>
</html>
