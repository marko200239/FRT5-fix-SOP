<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SOP 17 - 垂直馬達檢測</title>
    <style>
        body { font-family: "Microsoft JhengHei"; background: #0f0f0f; color: white; padding: 30px; line-height: 1.8; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border-top: 6px solid #d32f2f; }
        h1 { color: #d32f2f; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .step { background: #252525; margin-bottom: 15px; padding: 15px; border-radius: 8px; border-left: 4px solid #3498db; }
        .warning { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOP 17：垂直馬達無法作動檢測</h1>
        <div class="step">
            <b>1. 遙控器檢查：</b>使用 T8S 檢查數值有無跑掉。若異常請校正或調整數值。
        </div>
        <div class="step">
            <b>2. 控制盒繼電器：</b>機器人開機後推動瞄子，觀察砲塔控制盒繼電器是否有作動。無作動請更換控制盒。
        </div>
        <div class="step">
            <b>3. 線路與馬達：</b>檢查垂直馬達集線盒線路有無破損。若線路正常，量測馬達端正負極電阻值。<b>低於 1.多</b> 為馬達損壞。
        </div>
        <div class="step">
            <b>4. 近接開關：</b>若上述正常但仍不動作，檢查近接開關 LED 燈。若持續亮燈代表開關故障，需更換。
        </div>
        <button onclick="history.back()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">返回診斷系統</button>
    </div>
</body>
</html>
