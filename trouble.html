<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d10">
    <title>FRT 維修故障診斷系統</title>
    <link rel="stylesheet" href="motionnex-theme.css">
    <style>
        :root {
            --diag-bg: #0b0d10;
            --diag-card: rgba(22, 25, 31, 0.94);
            --diag-card-2: #20242b;
            --diag-line: rgba(255, 255, 255, 0.12);
            --diag-text: #f5f7fa;
            --diag-muted: #a8b0bb;
            --diag-red: #e31b23;
            --diag-red-dark: #a90f16;
            --diag-green: #31c873;
            --diag-blue: #4ba3ff;
            --diag-amber: #ffbf3f;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px 48px;
            background:
                radial-gradient(circle at 85% 10%, rgba(227, 27, 35, 0.15), transparent 28rem),
                linear-gradient(135deg, #08090b, var(--diag-bg) 52%, #11141a);
            color: var(--diag-text);
            font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
        }

        button, a { font: inherit; }

        .app-shell {
            width: min(100%, 820px);
            margin: 0 auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            margin-bottom: 18px;
            padding: 26px;
            border: 1px solid var(--diag-line);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(29, 33, 40, 0.97), rgba(14, 16, 20, 0.97));
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, var(--diag-red), #ff5960 55%, transparent);
        }

        .brand-line {
            margin: 0 0 8px;
            color: #ff6066;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.18em;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.55rem, 4vw, 2.35rem);
            line-height: 1.25;
        }

        .hero p {
            margin: 10px 0 0;
            color: var(--diag-muted);
            line-height: 1.7;
        }

        .progress-wrap {
            display: none;
            margin-bottom: 18px;
            padding: 14px 16px;
            border: 1px solid var(--diag-line);
            border-radius: 14px;
            background: rgba(15, 18, 23, 0.88);
        }

        .progress-wrap.visible { display: block; }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 9px;
            color: var(--diag-muted);
            font-size: 0.86rem;
        }

        .progress-track {
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: #2c3038;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--diag-red-dark), var(--diag-red));
            transition: width 220ms ease;
        }

        .panel {
            padding: clamp(20px, 4vw, 32px);
            border: 1px solid var(--diag-line);
            border-radius: 18px;
            background: var(--diag-card);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
        }

        .panel-label {
            margin: 0 0 10px;
            color: #ff656b;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .panel h2 {
            margin: 0;
            color: var(--diag-text);
            font-size: clamp(1.25rem, 3vw, 1.7rem);
            line-height: 1.5;
        }

        .instruction {
            margin: 12px 0 0;
            color: var(--diag-muted);
            line-height: 1.75;
        }

        .safety-note {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 191, 63, 0.42);
            border-left: 5px solid var(--diag-amber);
            border-radius: 10px;
            background: rgba(255, 191, 63, 0.09);
            color: #ffe0a0;
            line-height: 1.65;
        }

        .safety-note.visible { display: block; }

        .choice-grid {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .choice-button, .utility-button, .sop-button {
            width: 100%;
            min-height: 58px;
            border-radius: 11px;
            cursor: pointer;
            transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
        }

        .choice-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--diag-line);
            border-left: 6px solid var(--choice-color, var(--diag-blue));
            background: var(--diag-card-2);
            color: var(--diag-text);
            text-align: left;
            font-weight: 750;
            line-height: 1.45;
        }

        .choice-button:hover {
            transform: translateY(-1px);
            border-color: var(--choice-color, var(--diag-blue));
            background: #292e36;
        }

        .choice-button[data-tone="positive"] { --choice-color: var(--diag-green); }
        .choice-button[data-tone="negative"] { --choice-color: var(--diag-red); }
        .choice-button[data-tone="neutral"] { --choice-color: var(--diag-blue); }

        .choice-icon {
            display: grid;
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 50%;
            background: color-mix(in srgb, var(--choice-color) 18%, transparent);
            color: var(--choice-color);
            font-size: 0.9rem;
        }

        .symptom-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .symptom-grid .choice-button {
            min-height: 78px;
        }

        .utilities {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .utility-button, .sop-button {
            padding: 12px 16px;
            border: 1px solid var(--diag-line);
            background: rgba(255, 255, 255, 0.045);
            color: var(--diag-muted);
            text-decoration: none;
            text-align: center;
            font-weight: 700;
        }

        .utility-button:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--diag-text);
        }

        .result-mark {
            display: grid;
            width: 52px;
            height: 52px;
            margin-bottom: 18px;
            place-items: center;
            border-radius: 50%;
            background: rgba(75, 163, 255, 0.14);
            color: var(--diag-blue);
            font-size: 1.45rem;
            font-weight: 900;
        }

        .panel[data-result-kind="success"] .result-mark {
            background: rgba(49, 200, 115, 0.14);
            color: var(--diag-green);
        }

        .panel[data-result-kind="repair"] .result-mark {
            background: rgba(227, 27, 35, 0.14);
            color: #ff6066;
        }

        .sop-button {
            display: none;
            margin-top: 20px;
            border: 0;
            background: linear-gradient(135deg, var(--diag-red-dark), var(--diag-red));
            color: white;
            box-shadow: 0 8px 24px rgba(227, 27, 35, 0.22);
        }

        .sop-button.visible { display: block; }
        .sop-button:hover { transform: translateY(-1px); filter: brightness(1.08); }

        .choice-button:focus-visible, .utility-button:focus-visible, .sop-button:focus-visible {
            outline: 3px solid var(--diag-blue);
            outline-offset: 3px;
        }

        @media (max-width: 620px) {
            body { padding: 14px 12px 32px; }
            .hero { padding: 22px 20px; }
            .symptom-grid { grid-template-columns: 1fr; }
            .utilities { flex-direction: column; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }
    </style>
    <script src="motionnex-theme.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <header class="hero">
            <p class="brand-line">MOTIONNEX · FRT SERVICE</p>
            <h1>維修故障診斷系統</h1>
            <p>依照現場狀態逐步選擇，系統會引導至建議處置或對應 SOP。</p>
        </header>

        <section id="progress" class="progress-wrap" aria-label="診斷進度">
            <div class="progress-meta">
                <span id="path-name">診斷流程</span>
                <span id="step-count">第 1 步</span>
            </div>
            <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </section>

        <section id="diagnosis-panel" class="panel" aria-live="polite">
            <p id="panel-label" class="panel-label">選擇故障現象</p>
            <h2 id="panel-title">請問目前遇到哪一種狀況？</h2>
            <p id="panel-instruction" class="instruction">先選擇最接近的故障現象，再依實際檢查結果作答。</p>
            <div id="safety-note" class="safety-note"></div>
            <div id="choices" class="choice-grid symptom-grid"></div>
            <a id="sop-button" class="sop-button" href="sop_list.html">開啟對應 SOP</a>
            <div class="utilities">
                <button id="back-button" class="utility-button" type="button">← 返回上一步</button>
                <button id="restart-button" class="utility-button" type="button">重新選擇故障</button>
                <a class="utility-button" href="index.html">返回系統首頁</a>
            </div>
        </section>
    </main>

    <script>
        const SAFE_POWER_OFF = '涉及線路、接頭或零件拆換時，請先關閉設備電源，確認機構停止後再作業。';
        const SAFE_MOVEMENT = '手動調整砲塔前，請確認作動範圍內無人員與障礙物，避免夾傷或碰撞。';

        const symptoms = [
            { id: 'water-power', icon: '💧', label: '水柱／水霧無法切換', path: '水柱／水霧切換' },
            { id: 'vertical-sensor', icon: '↕', label: '砲塔無法垂直作動', path: '砲塔垂直作動' },
            { id: 'horizontal-limit', icon: '↔', label: '砲塔無法水平作動', path: '砲塔水平作動' },
            { id: 'control-power', icon: '◆', label: '無法操控機器人', path: '機器人操控' },
            { id: 'video-light', icon: '▣', label: '影像無法呈現', path: '可見光／熱顯像' },
            { id: 'gas-filter', icon: '◉', label: '五用氣體偵測儀異常', path: '五用氣體偵測' },
            { id: 'light-switch', icon: '✦', label: '車燈（圓燈／方燈）不會亮', path: '車燈' }
        ];

        const nodes = {
            'water-power': {
                title: '確認遙控器電源已開啟後，水柱／水霧是否可以正常切換？',
                detail: '先完成電源確認，再實際操作一次切換功能。',
                choices: [
                    { label: '可以正常切換', tone: 'positive', result: success('水柱／水霧切換已恢復正常。') },
                    { label: '仍然無法切換', tone: 'negative', next: 'water-drive' }
                ]
            },
            'water-drive': {
                title: '手動確認馬達動力傳動組後，機構是否正常？',
                detail: '檢查傳動機構是否卡住、鬆脫或無法帶動切換。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '機構正常，切換已恢復', tone: 'positive', result: success('水柱／水霧切換已恢復正常。') },
                    { label: '確認馬達動力傳動組故障', tone: 'negative', result: repair('更換馬達動力傳動組', '依 SOP-07 執行馬達動力傳動組更換，完成後重新測試切換功能。', 'sop7.html', 'SOP-07 馬達動力傳動組更換') }
                ]
            },

            'vertical-sensor': {
                title: '手動調整至上／下死點時，近接開關燈號是否正常？',
                detail: '依序確認上、下死點，並觀察近接開關的感應燈號。',
                safety: SAFE_MOVEMENT,
                choices: [
                    { label: '燈號正常，垂直作動已恢復', tone: 'positive', result: success('砲塔垂直作動已恢復正常。') },
                    { label: '燈號未亮或狀態異常', tone: 'negative', next: 'vertical-wire' }
                ]
            },
            'vertical-wire': {
                title: '查修近接開關線路後，垂直作動是否恢復？',
                detail: '確認接頭、線組與固定狀態，再重新測試。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '已恢復正常', tone: 'positive', result: success('砲塔垂直作動已恢復正常。') },
                    { label: '仍無法正常作動', tone: 'negative', result: repair('更換近接開關', '線路查修後仍異常，依 SOP-12 更換近接開關。', 'sop12.html', 'SOP-12 近接開關更換') }
                ]
            },

            'horizontal-limit': {
                title: '將砲塔瞄子手動調整至中心位置後，限位開關狀態是否正常？',
                detail: '確認中心位置與限位開關感應狀態。',
                safety: SAFE_MOVEMENT,
                choices: [
                    { label: '狀態正常，水平作動已恢復', tone: 'positive', result: success('砲塔水平作動已恢復正常。') },
                    { label: '限位開關狀態異常', tone: 'negative', next: 'horizontal-wire' }
                ]
            },
            'horizontal-wire': {
                title: '查修限位開關線路後，水平作動是否恢復？',
                detail: '確認接頭、線組與固定狀態，再重新測試。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '已恢復正常', tone: 'positive', result: success('砲塔水平作動已恢復正常。') },
                    { label: '仍無法正常作動', tone: 'negative', result: repair('更換限位開關座', '線路查修後仍異常，依 SOP-11 更換限位開關座。', 'sop11.html', 'SOP-11 限位開關座更換') }
                ]
            },

            'control-power': {
                title: '機器人與遙控器電源是否都已正確開啟？',
                detail: '確認兩端電源、急停狀態與基本顯示是否正常。',
                choices: [
                    { label: '是，兩端電源都已開啟', tone: 'positive', next: 'control-calibration' },
                    { label: '否，尚有電源未開啟', tone: 'negative', result: info('先完成電源開啟', '開啟機器人與遙控器電源後，返回上一步重新測試操控功能。') }
                ]
            },
            'control-calibration': {
                title: '重新校正遙控器後，是否可以正常操控？',
                detail: '完成校正程序後，再測試前進、後退與轉向。',
                choices: [
                    { label: '已恢復正常操控', tone: 'positive', result: success('機器人操控已恢復正常。') },
                    { label: '仍然無法操控', tone: 'negative', next: 'control-display' }
                ]
            },
            'control-display': {
                title: '狀態顯示表是否有顯示電壓／電量？',
                detail: '確認顯示內容是否穩定且可辨識。',
                choices: [
                    { label: '有正常顯示', tone: 'positive', next: 'control-driver' },
                    { label: '沒有顯示', tone: 'negative', result: repair('檢查面板開關線組', '先查修狀態顯示器與面板開關線組；確認面板開關線組損壞時，依 SOP-10 更換。', 'sop10.html', 'SOP-10 面板開關線組更換') }
                ]
            },
            'control-driver': {
                title: '使用治具檢查馬達驅動器並處理後，操控是否恢復？',
                detail: '依治具測試結果處理馬達驅動器，再重新測試操控。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '已恢復正常操控', tone: 'positive', result: success('機器人操控已恢復正常。') },
                    { label: '仍然無法操控', tone: 'negative', next: 'control-motor' }
                ]
            },
            'control-motor': {
                title: '測試馬達與輸出線路並完成修復後，操控是否恢復？',
                detail: '確認馬達與輸出線路測試結果，再執行復測。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '已恢復正常操控', tone: 'positive', result: success('機器人操控已恢復正常。') },
                    { label: '仍然無法操控', tone: 'negative', result: repair('更換底盤控制盒', '前項檢查均未排除故障時，依 SOP-13 更換底盤控制盒並復測。', 'sop13.html', 'SOP-13 底盤控制盒更換') }
                ]
            },

            'video-light': {
                title: '鏡頭燈號是否正常亮起？',
                detail: '分別確認可見光與熱顯像鏡頭的狀態燈。',
                choices: [
                    { label: '燈號正常', tone: 'positive', next: 'video-channel' },
                    { label: '燈號未亮或異常', tone: 'negative', next: 'video-wire' }
                ]
            },
            'video-wire': {
                title: '查修鏡頭電源與訊號線路後，影像是否恢復？',
                detail: '確認接頭與線組後，再查看平板影像。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '影像已恢復', tone: 'positive', result: success('影像投影已恢復正常。') },
                    { label: '仍然沒有影像', tone: 'negative', result: repair('執行影像故障排除', '依 SOP-03 進一步檢查攝影機與影像系統。', 'sop3.html', 'SOP-03 影像故障排除') }
                ]
            },
            'video-channel': {
                title: '平板目前選擇的影像頻道是否正確？',
                detail: '確認頻道設定後，分別切換可見光與熱顯像畫面。',
                choices: [
                    { label: '頻道正確，但仍無影像', tone: 'negative', next: 'video-tablet' },
                    { label: '頻道錯誤，調整後已恢復', tone: 'positive', result: success('影像頻道調整完成，投影已恢復正常。') },
                    { label: '頻道調整後仍無影像', tone: 'neutral', result: repair('執行影像故障排除', '依 SOP-03 檢查影像頻道與攝影機系統。', 'sop3.html', 'SOP-03 影像故障排除') }
                ]
            },
            'video-tablet': {
                title: '以行動裝置／平板再次確認，是否能顯示影像？',
                detail: '使用另一顯示端確認，可協助區分顯示端與傳輸端問題。',
                choices: [
                    { label: '可以顯示影像', tone: 'positive', result: success('影像來源正常，請查修原顯示裝置的設定或連線。') },
                    { label: '仍然無法顯示', tone: 'negative', next: 'video-gas-data' }
                ]
            },
            'video-gas-data': {
                title: '五用氣體偵測資料是否也無法正常回傳？',
                detail: '此項可協助判斷是否為共用控制／傳輸問題。',
                choices: [
                    { label: '是，氣體資料也無法回傳', tone: 'negative', result: repair('檢查 IO 控制盒', '影像與氣體資料同時異常，依 SOP-14 檢查並更換 IO 控制盒。', 'sop14.html', 'SOP-14 IO 控制盒更換') },
                    { label: '否，氣體資料可正常回傳', tone: 'positive', next: 'video-ip' }
                ]
            },
            'video-ip': {
                title: '請由產品工程師確認影像設備 IP 設定，設定是否異常？',
                detail: '先比對正確 IP 與網路設定，再決定是否更換主機。',
                choices: [
                    { label: 'IP 異常，修正後影像已恢復', tone: 'positive', result: success('IP 設定修正完成，影像投影已恢復正常。') },
                    { label: 'IP 正常，但仍無影像', tone: 'negative', result: repair('進一步檢查博遠主機', '前項均正常但仍無影像，請由產品工程師確認博遠主機並依檢測結果更換。') }
                ]
            },

            'gas-filter': {
                title: '檢查濾管、濾嘴與濾棉後，氣體偵測是否恢復正常？',
                detail: '確認沒有堵塞、破損或裝配不良。',
                choices: [
                    { label: '已恢復正常偵測', tone: 'positive', result: success('五用氣體偵測已恢復正常。') },
                    { label: '仍然無法正常偵測', tone: 'negative', next: 'gas-battery' }
                ]
            },
            'gas-battery': {
                title: '五用氣體偵測儀的電量是否充足？',
                detail: '確認儀器可正常充電，且電量足以完成測試。',
                choices: [
                    { label: '電量充足', tone: 'positive', next: 'gas-phone-wifi' },
                    { label: '電量不足，但可正常充電', tone: 'neutral', result: info('先完成充電再測試', '將偵測儀充足電後，返回上一步重新檢查參數傳輸。') },
                    { label: '無法正常充電', tone: 'negative', result: repair('檢查 IO 控制盒', '確認充電線與電源均正常後仍無法充電，依 SOP-14 檢查 IO 控制盒。', 'sop14.html', 'SOP-14 IO 控制盒更換') }
                ]
            },
            'gas-phone-wifi': {
                title: '手機與偵測儀的 Wi-Fi 連線是否正常？',
                detail: '確認連線名稱、訊號與資料更新狀態。',
                choices: [
                    { label: '手機 Wi-Fi 連線正常', tone: 'positive', next: 'gas-tablet' },
                    { label: '連線異常，重連後已恢復', tone: 'neutral', result: success('手機 Wi-Fi 重新連線後，氣體參數已正常傳輸。') },
                    { label: '重新連線後仍異常', tone: 'negative', next: 'gas-tablet' }
                ]
            },
            'gas-tablet': {
                title: '遙控箱平板的連線與參數傳輸是否正常？',
                detail: '確認平板已連上正確網路，且參數持續更新。',
                choices: [
                    { label: '連線正常，參數可正常傳輸', tone: 'positive', result: success('五用氣體參數傳輸已恢復正常。') },
                    { label: '連線正常但參數仍未回傳', tone: 'negative', result: repair('檢查 IO 控制盒', '網路連線正常但仍無參數，依 SOP-14 檢查並更換 IO 控制盒。', 'sop14.html', 'SOP-14 IO 控制盒更換') },
                    { label: '平板連線異常', tone: 'neutral', result: info('先排除平板連線', '重新連接遙控箱平板的正確網路後，再測試氣體參數是否更新。') }
                ]
            },

            'light-switch': {
                title: '將遙控器搖頭開關向左開啟後，車燈是否亮起？',
                detail: '分別確認圓燈與方燈的狀態。',
                choices: [
                    { label: '車燈已正常亮起', tone: 'positive', result: success('車燈已正常開啟。') },
                    { label: '車燈仍然不亮', tone: 'negative', next: 'light-wire' }
                ]
            },
            'light-wire': {
                title: '查修 A－圓燈／B－方燈線路後，車燈是否恢復？',
                detail: '依故障燈型確認線路與接頭，再重新測試。',
                safety: SAFE_POWER_OFF,
                choices: [
                    { label: '車燈已恢復正常', tone: 'positive', result: success('車燈已恢復正常。') },
                    { label: '確認燈具故障', tone: 'negative', result: repair('更換砲塔大燈', '依 SOP-09 更換對應的圓燈或方燈。', 'sop9.html', 'SOP-09 砲塔大燈更換') }
                ]
            }
        };

        const state = { current: 'start', history: [], path: '' };
        const panel = document.getElementById('diagnosis-panel');
        const label = document.getElementById('panel-label');
        const title = document.getElementById('panel-title');
        const instruction = document.getElementById('panel-instruction');
        const safety = document.getElementById('safety-note');
        const choices = document.getElementById('choices');
        const sopButton = document.getElementById('sop-button');
        const progress = document.getElementById('progress');
        const pathName = document.getElementById('path-name');
        const stepCount = document.getElementById('step-count');
        const progressBar = document.getElementById('progress-bar');
        const backButton = document.getElementById('back-button');

        function success(body) { return { kind: 'success', title: '檢查完成', body }; }
        function info(titleText, body) { return { kind: 'info', title: titleText, body }; }
        function repair(titleText, body, sop = '', sopLabel = '') { return { kind: 'repair', title: titleText, body, sop, sopLabel }; }

        function setText(element, value) {
            element.textContent = value || '';
            element.hidden = !value;
        }

        function makeChoice(item, index) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'choice-button';
            button.dataset.tone = item.tone || 'neutral';
            button.innerHTML = `<span class="choice-icon" aria-hidden="true">${item.tone === 'positive' ? '✓' : item.tone === 'negative' ? '!' : '→'}</span><span></span>`;
            button.lastElementChild.textContent = item.label;
            button.addEventListener('click', () => {
                if (item.next) navigate(item.next);
                if (item.result) showResult(item.result);
            });
            if (index === 0) button.dataset.firstChoice = 'true';
            return button;
        }

        function updateProgress(isResult = false) {
            const active = state.current !== 'start';
            progress.classList.toggle('visible', active);
            pathName.textContent = state.path || '診斷流程';
            const count = Math.max(1, state.history.filter(item => item.type === 'node').length + (isResult ? 0 : 1));
            stepCount.textContent = isResult ? `已完成 ${count} 項檢查` : `第 ${count} 項檢查`;
            progressBar.style.width = isResult ? '100%' : `${Math.min(88, 22 + count * 16)}%`;
        }

        function renderStart() {
            state.current = 'start';
            state.history = [];
            state.path = '';
            panel.removeAttribute('data-result-kind');
            label.hidden = false;
            label.textContent = '選擇故障現象';
            title.textContent = '請問目前遇到哪一種狀況？';
            setText(instruction, '先選擇最接近的故障現象，再依實際檢查結果作答。');
            safety.classList.remove('visible');
            safety.textContent = '';
            sopButton.classList.remove('visible');
            choices.className = 'choice-grid symptom-grid';
            choices.replaceChildren(...symptoms.map(symptom => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'choice-button';
                button.dataset.tone = 'neutral';
                button.innerHTML = `<span class="choice-icon" aria-hidden="true"></span><span></span>`;
                button.firstElementChild.textContent = symptom.icon;
                button.lastElementChild.textContent = symptom.label;
                button.addEventListener('click', () => {
                    state.path = symptom.path;
                    navigate(symptom.id);
                });
                return button;
            }));
            backButton.disabled = true;
            backButton.style.visibility = 'hidden';
            updateProgress();
        }

        function navigate(id, fromBack = false) {
            const node = nodes[id];
            if (!node) {
                showResult(info('找不到診斷步驟', '請返回故障選單後重新選擇。'));
                return;
            }
            if (!fromBack && state.current !== 'start') state.history.push({ type: 'node', id: state.current });
            if (!fromBack && state.current === 'start') state.history.push({ type: 'start' });
            state.current = id;
            panel.removeAttribute('data-result-kind');
            label.hidden = false;
            label.textContent = state.path;
            title.textContent = node.title;
            setText(instruction, node.detail);
            safety.textContent = node.safety || '';
            safety.classList.toggle('visible', Boolean(node.safety));
            sopButton.classList.remove('visible');
            choices.className = 'choice-grid';
            choices.replaceChildren(...node.choices.map(makeChoice));
            backButton.disabled = false;
            backButton.style.visibility = 'visible';
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            requestAnimationFrame(() => choices.querySelector('[data-first-choice]')?.focus({ preventScroll: true }));
        }

        function showResult(result) {
            state.history.push({ type: 'node', id: state.current });
            state.current = 'result';
            panel.dataset.resultKind = result.kind;
            label.hidden = false;
            label.textContent = result.kind === 'success' ? '診斷完成' : '診斷建議';
            title.textContent = result.title;
            setText(instruction, result.body);
            safety.classList.remove('visible');
            safety.textContent = '';
            choices.className = 'choice-grid';
            const mark = document.createElement('div');
            mark.className = 'result-mark';
            mark.setAttribute('aria-hidden', 'true');
            mark.textContent = result.kind === 'success' ? '✓' : result.kind === 'repair' ? '!' : 'i';
            choices.replaceChildren(mark);
            if (result.sop) {
                sopButton.href = result.sop;
                sopButton.textContent = `開啟 ${result.sopLabel || '對應 SOP'}`;
                sopButton.classList.add('visible');
            } else {
                sopButton.classList.remove('visible');
            }
            backButton.disabled = false;
            backButton.style.visibility = 'visible';
            updateProgress(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            const previous = state.history.pop();
            if (!previous || previous.type === 'start') {
                renderStart();
                return;
            }
            navigate(previous.id, true);
        }

        backButton.addEventListener('click', goBack);
        document.getElementById('restart-button').addEventListener('click', renderStart);
        renderStart();
    </script>
</body>
</html>
