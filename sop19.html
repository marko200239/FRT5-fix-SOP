<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>SOP 19 - 瞄子歪斜處理</title>
    <style>
        body { font-family: "Microsoft JhengHei"; background: #0f0f0f; color: white; padding: 30px; line-height: 1.8; }
        .container { max-width: 800px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border-top: 6px solid #d32f2f; }
        h1 { color: #d32f2f; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .step { background: #252525; margin-bottom: 15px; padding: 15px; border-radius: 8px; border-left: 4px solid #f1c40f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOP 19：瞄子歪斜與鬆動處理</h1>
        <div class="step">1. <b>管束檢查：</b>確認管束是否鬆動，鎖緊時切勿影響水柱水霧伸縮。</div>
        <div class="step">2. <b>連接環處理：</b>使用英制六角板手放鬆止付螺絲（注意鋼珠不可掉出_)。</div>
        <div class="step">3. <b>鎖緊：</b>使用月牙鉤將黑色連接環鎖緊後，再將止付螺絲鎖回固定。</div>
        <button onclick="history.back()" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">返回</button>
    </div>
</body>
</html>
